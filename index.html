<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Projekte · Bergliacht</title>
<!-- App-Symbol und Home-Bildschirm (iPhone) -->
<meta name="theme-color" content="#2c2620">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bergliacht">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* ==========================================================
   Tokens (aus dem Bergliacht-Webshop übernommen)
========================================================== */

@font-face { font-family: "Satoshi"; src: url("assets/fonts/Satoshi-Regular.woff") format("woff"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Satoshi"; src: url("assets/fonts/Satoshi-Medium.woff") format("woff"); font-weight: 500 600; font-display: swap; }
@font-face { font-family: "Satoshi"; src: url("assets/fonts/Satoshi-Bold.woff") format("woff"); font-weight: 700; font-display: swap; }

:root {
    --color-primary: #6A4B3B;
    --color-primary-light: #856555;
    --color-primary-dark: #563B2F;
    --color-accent: #5C7257;
    --color-background: #F5F1EA;
    --color-surface: #E8E1D7;
    --color-surface-secondary: #EEE8DF;
    --color-surface-tertiary: #DDD5CA;
    --color-text-primary: #3B342D;
    --color-text-secondary: #6E655C;
    --color-text-muted: #8A8076;
    --color-text-inverse: #F5F1EA;
    --color-border: #C9BFB2;
    --color-border-strong: #AFA397;
    --color-warning: #C39232;
    --color-danger: #B64D4D;
    --color-info: #50739A;

    --radius-xs: .25rem; --radius-sm: .5rem; --radius-md: .75rem; --radius-lg: 1rem; --radius-xl: 1.5rem; --radius-full: 9999px;

    --shadow-xs: 0 1px 2px rgba(59, 52, 45, .04);
    --shadow-sm: 0 2px 6px rgba(59, 52, 45, .06);
    --shadow-md: 0 8px 20px rgba(59, 52, 45, .08);
    --shadow-lg: 0 16px 40px rgba(59, 52, 45, .10);
    --shadow-xl: 0 24px 60px rgba(59, 52, 45, .14);

    --space-1: .25rem; --space-2: .5rem; --space-3: .75rem; --space-4: 1rem; --space-5: 1.25rem; --space-6: 1.5rem;
    --space-8: 2rem; --space-10: 2.5rem; --space-12: 3rem; --space-16: 4rem; --space-20: 5rem; --space-24: 6rem;

    --transition-fast: .15s ease; --transition-base: .25s ease; --transition-slow: .4s ease;

    --font-family-base: "Satoshi", system-ui, sans-serif;
    --font-size-xs: .75rem; --font-size-sm: .875rem; --font-size-base: 1rem; --font-size-md: 1.125rem;
    --font-size-lg: 1.25rem; --font-size-xl: 1.5rem; --font-size-2xl: 2rem; --font-size-3xl: 2.5rem; --font-size-4xl: 3rem; --font-size-5xl: 4rem;

    --container: 1280px;
    --overlay: rgba(28, 23, 19, .68);

    /* Originalbild für große Bildschirme, verkleinerte Fassung fürs Handy */
    --hero-image: url("assets/images/hero.jpg");
}

/* ==========================================================
   Base
========================================================== */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
    font-family: var(--font-family-base);
    font-size: var(--font-size-base);
    line-height: 1.6;
    color: var(--color-text-primary);
    background: var(--color-background);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
a { color: inherit; text-decoration: none; }
svg.icon { width: 1.25rem; height: 1.25rem; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
::selection { background: var(--color-primary); color: var(--color-text-inverse); }
:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 3px; border-radius: var(--radius-xs); }

.container { width: 100%; max-width: var(--container); margin: 0 auto; padding: 0 var(--space-8); }
.label {
    font-size: var(--font-size-xs);
    font-weight: 500;
    letter-spacing: .14em;
    text-transform: uppercase;
}
[hidden] { display: none !important; }

/* ==========================================================
   Buttons
========================================================== */

.btn {
    display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
    height: 3.25rem; padding: 0 var(--space-6);
    border-radius: var(--radius-sm);
    font-size: var(--font-size-sm); font-weight: 500; letter-spacing: .12em; text-transform: uppercase;
    transition: background var(--transition-base), transform var(--transition-fast), box-shadow var(--transition-base);
}
.btn:active { transform: translateY(1px); }
.btn--light { background: var(--color-background); color: var(--color-text-primary); }
.btn--light:hover { background: #fff; box-shadow: var(--shadow-md); }
.icon-btn {
    display: inline-grid; place-items: center;
    width: 2.5rem; height: 2.5rem; border-radius: var(--radius-full);
    transition: background var(--transition-fast), color var(--transition-fast);
}

/* ==========================================================
   Passwortseite
========================================================== */

.lock {
    position: fixed; inset: 0; z-index: 50;
    display: grid; place-items: center;
    padding: max(var(--space-6), env(safe-area-inset-top)) var(--space-6) max(var(--space-6), env(safe-area-inset-bottom));
    color: var(--color-text-inverse);
    background:
        radial-gradient(ellipse 38rem 30rem at 50% 45%, rgba(28, 23, 19, .55), rgba(28, 23, 19, 0) 70%),
        linear-gradient(0deg, rgba(28, 23, 19, .6), rgba(28, 23, 19, .3) 60%, rgba(28, 23, 19, .5)),
        var(--hero-image) center 35% / cover no-repeat,
        #2c2620;
    transition: opacity var(--transition-slow), visibility var(--transition-slow);
}
.lock.is-leaving { opacity: 0; visibility: hidden; }
.lock__inner { width: 100%; max-width: 26rem; text-align: center; }
.lock__logo { width: 4.5rem; height: 4.5rem; margin: 0 auto var(--space-8); color: var(--color-text-inverse); }
.lock__label { opacity: .85; margin-bottom: var(--space-4); }
.lock__title {
    font-size: clamp(2.5rem, 7vw, var(--font-size-5xl));
    font-weight: 400; line-height: 1.05; letter-spacing: -.035em;
    margin-bottom: var(--space-4);
}
.lock__text { opacity: .85; margin-bottom: var(--space-10); }
.lock__form { display: flex; flex-direction: column; gap: var(--space-3); }
.lock__field { position: relative; }
.lock__field svg { position: absolute; left: var(--space-4); top: 50%; translate: 0 -50%; opacity: .7; }
.lock__input {
    width: 100%; height: 3.25rem;
    padding: 0 var(--space-4) 0 3rem;
    border-radius: var(--radius-sm);
    border: 1px solid rgba(245, 241, 234, .35);
    background: rgba(245, 241, 234, .12);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    color: var(--color-text-inverse);
    transition: border-color var(--transition-base), background var(--transition-base);
}
.lock__input::placeholder { color: rgba(245, 241, 234, .65); }
.lock__input:focus { outline: none; border-color: rgba(245, 241, 234, .8); background: rgba(245, 241, 234, .18); }
.lock__form.is-error { animation: shake .4s ease; }
.lock__form.is-error .lock__input { border-color: #e09a9a; }
.lock__hint { margin-top: var(--space-6); font-size: var(--font-size-xs); opacity: .6; }
.lock__remember {
    display: flex; align-items: center; justify-content: center; gap: var(--space-2);
    margin-top: var(--space-2);
    font-size: var(--font-size-sm); opacity: .85; cursor: pointer; user-select: none;
}
.lock__remember input {
    appearance: none; -webkit-appearance: none;
    width: 1.1rem; height: 1.1rem; margin: 0;
    border-radius: var(--radius-xs);
    border: 1px solid rgba(245, 241, 234, .55);
    background: rgba(245, 241, 234, .1);
    display: grid; place-items: center; cursor: pointer;
    transition: background var(--transition-fast), border-color var(--transition-fast);
}
.lock__remember input::after {
    content: ""; width: .3rem; height: .55rem; margin-top: -2px;
    border: solid var(--color-text-primary); border-width: 0 2px 2px 0;
    transform: rotate(45deg) scale(0); transition: transform var(--transition-fast);
}
.lock__remember input:checked { background: var(--color-background); border-color: var(--color-background); }
.lock__remember input:checked::after { transform: rotate(45deg) scale(1); }
.lock__error { min-height: 1.4em; margin-top: var(--space-4); font-size: var(--font-size-sm); color: #f0b4b4; }
.btn[disabled] { opacity: .7; cursor: progress; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

/* ==========================================================
   Header + Hero
========================================================== */

.header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    padding-top: env(safe-area-inset-top);   /* Platz für die Statusleiste am iPhone */
    color: var(--color-text-inverse);
}
.header__inner {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    height: 6rem;
}
.header__domain { font-size: var(--font-size-sm); opacity: .85; display: flex; align-items: center; gap: var(--space-2); }
.header__domain .dot { width: .5rem; height: .5rem; border-radius: 50%; background: #9fb894; box-shadow: 0 0 0 3px rgba(159, 184, 148, .25); }
.header__logo { width: 3.25rem; height: 3.25rem; color: var(--color-text-inverse); }
.header__actions { justify-self: end; display: flex; gap: var(--space-1); }
.header__actions .icon-btn:hover { background: rgba(245, 241, 234, .14); }

.hero {
    position: relative;
    min-height: min(64vh, 40rem);
    display: flex; align-items: flex-end;
    padding: 9rem 0 var(--space-16);
    color: var(--color-text-inverse);
    background:
        linear-gradient(90deg, rgba(28, 23, 19, .68) 0%, rgba(28, 23, 19, .38) 45%, rgba(28, 23, 19, .08) 75%),
        linear-gradient(0deg, rgba(28, 23, 19, .28), rgba(0, 0, 0, 0) 42%),
        var(--hero-image) center 35% / cover no-repeat,
        #2c2620;
}
.hero__label { margin-bottom: var(--space-5); opacity: .9; }
.hero__title {
    font-size: clamp(2.75rem, 7vw, 4.5rem);
    font-weight: 400; line-height: 1.02; letter-spacing: -.035em;
    margin-bottom: var(--space-5);
}
.hero__text { max-width: 30rem; opacity: .9; margin-bottom: var(--space-10); }
.hero__stats { display: flex; flex-wrap: wrap; gap: var(--space-10); }
.stat__value { font-size: var(--font-size-2xl); line-height: 1; letter-spacing: -.02em; }
.stat__label { margin-top: var(--space-2); opacity: .75; }

/* ==========================================================
   Explorer
========================================================== */

.explorer { padding: var(--space-16) 0 var(--space-24); }
.explorer__layout { display: grid; grid-template-columns: 15rem minmax(0, 1fr); gap: var(--space-12); align-items: start; }
.explorer__layout > * { min-width: 0; }

/* Seitenleiste */

.sidebar { position: sticky; top: var(--space-8); }
.sidebar__title { color: var(--color-text-muted); margin-bottom: var(--space-4); padding: 0 var(--space-3); }
.folders { display: flex; flex-direction: column; gap: 2px; list-style: none; }
.folder {
    width: 100%;
    display: flex; align-items: center; gap: var(--space-3);
    padding: var(--space-3);
    border-radius: var(--radius-sm);
    color: var(--color-text-secondary);
    text-align: left;
    transition: background var(--transition-fast), color var(--transition-fast);
}
.folder:hover { background: var(--color-surface-secondary); color: var(--color-text-primary); }
.folder.is-active { background: var(--color-surface); color: var(--color-text-primary); }
.folder.is-active .folder__icon { color: var(--color-primary); }
.folder__name { flex: 1; }
.folder__count {
    min-width: 1.5rem; padding: 0 var(--space-2);
    font-size: var(--font-size-xs); text-align: center;
    border-radius: var(--radius-full);
    background: var(--color-surface-secondary); color: var(--color-text-muted);
}
.folder.is-active .folder__count { background: var(--color-background); }
.folder--sub { padding: var(--space-2) var(--space-3) var(--space-2) var(--space-10); font-size: var(--font-size-sm); }
.folder--sub .folder__icon { width: 1rem; height: 1rem; }
.sidebar__note {
    margin-top: var(--space-8); padding: var(--space-5);
    border-radius: var(--radius-md);
    border: 1px solid var(--color-border);
    font-size: var(--font-size-sm); color: var(--color-text-secondary);
}
.sidebar__note strong { display: block; font-weight: 500; color: var(--color-text-primary); margin-bottom: var(--space-1); }

/* Werkzeugleiste */

.toolbar {
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-4);
    padding-bottom: var(--space-5);
    margin-bottom: var(--space-8);
    border-bottom: 1px solid var(--color-border);
}
.crumbs { display: flex; align-items: center; gap: var(--space-2); font-size: var(--font-size-sm); color: var(--color-text-muted); min-width: 0; }
.crumbs svg { width: 1rem; height: 1rem; }
.crumbs__current { color: var(--color-text-primary); font-weight: 500; white-space: nowrap; }
#crumb { display: flex; align-items: center; gap: var(--space-2); }
.crumbs__up { font-weight: 400; color: var(--color-text-muted); white-space: nowrap; transition: color var(--transition-fast); }
.crumbs__up:hover { color: var(--color-text-primary); }
.toolbar__right { display: flex; align-items: center; gap: var(--space-3); }
.search { position: relative; }
.search svg { position: absolute; left: var(--space-3); top: 50%; translate: 0 -50%; width: 1.1rem; height: 1.1rem; color: var(--color-text-muted); pointer-events: none; }
.search input {
    width: 15rem; height: 2.5rem;
    padding: 0 var(--space-3) 0 2.4rem;
    border-radius: var(--radius-full);
    border: 1px solid var(--color-border);
    background: var(--color-surface-secondary);
    font-size: var(--font-size-sm);
    transition: border-color var(--transition-base), background var(--transition-base), width var(--transition-base);
}
.search input::placeholder { color: var(--color-text-muted); }
.search input:focus { outline: none; border-color: var(--color-border-strong); background: #fff; }
.segmented { display: flex; padding: 3px; border-radius: var(--radius-full); background: var(--color-surface); }
.segmented button {
    display: grid; place-items: center; width: 2.25rem; height: 2.125rem;
    border-radius: var(--radius-full); color: var(--color-text-muted);
    transition: background var(--transition-fast), color var(--transition-fast), box-shadow var(--transition-fast);
}
.segmented button svg { width: 1.1rem; height: 1.1rem; }
.segmented button.is-active { background: var(--color-background); color: var(--color-text-primary); box-shadow: var(--shadow-sm); }

.summary { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: var(--space-6); }
.summary__title { font-size: var(--font-size-2xl); font-weight: 400; letter-spacing: -.02em; }
.summary__count { color: var(--color-text-muted); font-size: var(--font-size-sm); }

/* Kacheln */

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); gap: var(--space-6); }
.card {
    display: flex; flex-direction: column;
    border-radius: var(--radius-lg);
    background: var(--color-surface-secondary);
    overflow: hidden;
    transition: transform var(--transition-base), box-shadow var(--transition-base), background var(--transition-base);
    animation: rise .5s ease both;
}
.card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); background: #fff; }
.card__thumb { position: relative; aspect-ratio: 4 / 3; overflow: hidden; display: grid; place-items: center; }
.card__thumb::before {
    content: ""; position: absolute; inset: -10%;
    background: var(--contours) center / 120% no-repeat;
    opacity: .4;
    transition: transform var(--transition-slow);
}
.card:hover .card__thumb::before { transform: scale(1.06); }
.card__glyph {
    position: relative;
    width: 4.5rem; height: 4.5rem;
    display: grid; place-items: center;
    border-radius: var(--radius-xl);
    background: rgba(255, 255, 255, .55);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow: var(--shadow-sm);
    transition: transform var(--transition-base);
}
.card:hover .card__glyph { transform: translateY(-3px) rotate(-3deg); }
.card__glyph svg { width: 2rem; height: 2rem; stroke-width: 1.3; }
.card__tag {
    position: absolute; top: var(--space-4); left: var(--space-4);
    padding: var(--space-1) var(--space-3);
    border-radius: var(--radius-full);
    background: rgba(245, 241, 234, .85);
    font-size: var(--font-size-xs); font-weight: 500; letter-spacing: .1em; text-transform: uppercase;
    color: var(--color-text-secondary);
}
.card__status {
    position: absolute; top: var(--space-4); right: var(--space-4);
    display: flex; align-items: center; gap: .4rem;
    font-size: var(--font-size-xs); color: var(--color-text-secondary);
}
.card__status::before { content: ""; width: .45rem; height: .45rem; border-radius: 50%; background: var(--color-warning); }
.card__body { padding: var(--space-5) var(--space-5) var(--space-6); display: flex; flex-direction: column; gap: var(--space-2); flex: 1; }
.card__title { font-size: var(--font-size-lg); font-weight: 500; letter-spacing: -.01em; line-height: 1.3; }
.card__desc { font-size: var(--font-size-sm); color: var(--color-text-secondary); flex: 1; }
.card__meta {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: var(--space-3); padding-top: var(--space-4);
    border-top: 1px solid var(--color-border);
    font-size: var(--font-size-xs); color: var(--color-text-muted);
}
.card__open { display: flex; align-items: center; gap: var(--space-1); color: var(--color-text-primary); font-weight: 500; letter-spacing: .1em; text-transform: uppercase; }
.card__open svg { width: 1rem; height: 1rem; transition: transform var(--transition-base); }
.card:hover .card__open svg { transform: translateX(3px); }

/* Unterordner (z. B. UI-Kits › Grundlagen) */
.subfolders { display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); gap: var(--space-4); }
.subfolder {
    display: flex; align-items: center; gap: var(--space-4);
    padding: var(--space-5);
    border-radius: var(--radius-lg);
    background: var(--color-surface-secondary);
    text-align: left;
    transition: transform var(--transition-base), box-shadow var(--transition-base), background var(--transition-base);
    animation: rise .5s ease both;
}
.subfolder:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); background: #fff; }
.subfolder__icon { width: 3rem; height: 3rem; flex: none; display: grid; place-items: center; border-radius: var(--radius-md); background: var(--tint); color: var(--ink); }
.subfolder__icon svg { width: 1.4rem; height: 1.4rem; }
.subfolder__name { display: block; font-weight: 500; }
.subfolder__count { display: block; font-size: var(--font-size-sm); color: var(--color-text-muted); }
.subfolder.is-empty { background: transparent; border: 1.5px dashed var(--color-border); }
.subfolder.is-empty .subfolder__icon { background: var(--color-surface-secondary); color: var(--color-text-muted); }

/* Kategorie-Farben: dezente Tönungen aus der Bergliacht-Palette */
.c-web  { --tint: #E2D7CC; --ink: var(--color-primary); }
.c-3d   { --tint: #D9DED2; --ink: var(--color-accent); }
.c-app  { --tint: #D8DDE2; --ink: var(--color-info); }
.c-exp  { --tint: #E8DFC9; --ink: #9A7429; }
.card__thumb { background: var(--tint); color: var(--ink); }

/* Liste */

.list { border-top: 1px solid var(--color-border); }
.list__head, .row {
    display: grid; grid-template-columns: minmax(0, 1fr) 9rem 7rem 2rem;
    align-items: center; gap: var(--space-4);
    padding: var(--space-4) var(--space-3);
}
.list__head { color: var(--color-text-muted); border-bottom: 1px solid var(--color-border); padding-top: var(--space-3); padding-bottom: var(--space-3); }
.row { border-bottom: 1px solid var(--color-border); border-radius: var(--radius-sm); transition: background var(--transition-fast); animation: rise .4s ease both; }
.row:hover { background: var(--color-surface-secondary); }
.row__name { display: flex; align-items: center; gap: var(--space-4); min-width: 0; }
.row__icon { width: 2.75rem; height: 2.75rem; flex: none; display: grid; place-items: center; border-radius: var(--radius-md); background: var(--tint); color: var(--ink); }
.row__icon svg { width: 1.25rem; height: 1.25rem; }
.row__title { font-weight: 500; }
.row__desc { font-size: var(--font-size-sm); color: var(--color-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row__cell { font-size: var(--font-size-sm); color: var(--color-text-secondary); }
.row__arrow { color: var(--color-text-muted); transition: transform var(--transition-base), color var(--transition-base); }
.row:hover .row__arrow { transform: translateX(3px); color: var(--color-text-primary); }

/* Leerer Zustand */

.empty {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: var(--space-20) var(--space-6);
    border: 1.5px dashed var(--color-border);
    border-radius: var(--radius-xl);
    background: var(--color-surface-secondary);
    animation: rise .6s ease both;
}
.empty__art { width: 11rem; height: auto; margin-bottom: var(--space-8); color: var(--color-primary); }
.empty__label { color: var(--color-text-muted); margin-bottom: var(--space-3); }
.empty__title { font-size: var(--font-size-3xl); font-weight: 400; letter-spacing: -.03em; line-height: 1.1; margin-bottom: var(--space-4); }
.empty__text { max-width: 28rem; color: var(--color-text-secondary); }
.empty__next {
    margin-top: var(--space-8);
    display: inline-flex; align-items: center; gap: var(--space-3);
    padding: var(--space-2) var(--space-4) var(--space-2) var(--space-2);
    border-radius: var(--radius-full);
    background: var(--color-background);
    border: 1px solid var(--color-border);
    font-size: var(--font-size-sm); color: var(--color-text-secondary);
}
.empty__next .pulse { width: 1.75rem; height: 1.75rem; border-radius: 50%; display: grid; place-items: center; background: #F1E6CF; }
.empty__next .pulse::before { content: ""; width: .5rem; height: .5rem; border-radius: 50%; background: var(--color-warning); animation: pulse 1.8s ease-in-out infinite; }
.empty__next strong { color: var(--color-text-primary); font-weight: 500; }
@keyframes pulse { 50% { transform: scale(1.5); opacity: .5; } }

.no-results { padding: var(--space-16) 0; text-align: center; color: var(--color-text-secondary); }

@keyframes rise { from { opacity: 0; transform: translateY(12px); } }

/* Footer */

.footer { border-top: 1px solid var(--color-border); padding: var(--space-10) 0; color: var(--color-text-muted); font-size: var(--font-size-sm); }
.footer__inner { display: flex; justify-content: space-between; align-items: center; gap: var(--space-4); }
.footer__brand { display: flex; align-items: center; gap: var(--space-3); color: var(--color-text-secondary); }
.footer__brand svg { width: 1.75rem; height: 1.75rem; color: var(--color-primary); }

/* ==========================================================
   Responsive
========================================================== */

@media (max-width: 960px) {
    .explorer__layout { grid-template-columns: minmax(0, 1fr); gap: var(--space-8); }
    .sidebar { position: static; }
    .sidebar__title, .sidebar__note { display: none; }
    .folders { flex-direction: row; overflow-x: auto; gap: var(--space-2); margin: 0 calc(var(--space-8) * -1); padding: 0 var(--space-8); scrollbar-width: none; }
    .folders::-webkit-scrollbar { display: none; }
    .folder { width: auto; white-space: nowrap; border: 1px solid var(--color-border); border-radius: var(--radius-full); padding: var(--space-2) var(--space-4); }
    .folder.is-active { border-color: var(--color-surface); }
    .folder--sub { padding: var(--space-2) var(--space-4); }
}
@media (max-width: 640px) {
    :root { --hero-image: url("assets/images/hero-mobil.jpg"); }
    .container { padding: 0 var(--space-4); }
    .folders { margin: 0 calc(var(--space-4) * -1); padding: 0 var(--space-4); }
    .header__inner { height: 5rem; }
    .header__domain span:last-child { display: none; }
    .header__logo { width: 2.75rem; height: 2.75rem; }
    .hero { padding-top: 7rem; padding-bottom: var(--space-12); }
    .hero__stats { gap: var(--space-8); }
    .toolbar { flex-wrap: wrap; }
    .toolbar__right { width: 100%; }
    .search { flex: 1; }
    .search input { width: 100%; }
    .list__head { display: none; }
    .row { grid-template-columns: minmax(0, 1fr) 1.5rem; }
    .row__cell { display: none; }
    .empty { padding: var(--space-12) var(--space-5); }
    .empty__title { font-size: var(--font-size-2xl); }
    .footer__inner { flex-direction: column; text-align: center; }
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

        <p class="lock__text">Diese Seite ist geschützt.<br>Gib dein Passwort ein, um fortzufahren.</p>
        <form class="lock__form" id="lockForm" autocomplete="off">
            <div class="lock__field">
                <svg class="icon"><use href="#i-lock"/></svg>
                <input class="lock__input" id="lockInput" type="password" placeholder="Passwort" aria-label="Passwort" autocomplete="current-password">
            </div>
            <button class="btn btn--light" id="lockButton" type="submit">Entsperren</button>
            <label class="lock__remember"><input type="checkbox" id="lockRemember" checked> Auf diesem Gerät angemeldet bleiben</label>
        </form>
        <p class="lock__error" id="lockError" role="alert"></p>
        <p class="lock__hint" id="lockHint" hidden>Lokale Vorschau: Jedes beliebige Passwort öffnet die Seite.</p>
    </div>
</section>

<script>
/* Kategorien = Ordner im Explorer */
const CATEGORIES = [
    { id: "alle", name: "Alle Projekte", icon: "i-all" },
    { id: "web",  name: "UI-Kits",       icon: "i-web", subs: [
        { id: "grundlagen", name: "Grundlagen" },
        { id: "unterkunft", name: "Unterkünfte" },
        { id: "handwerk",   name: "Handwerk" },
        { id: "gesundheit", name: "Gesundheit & Therapie" },
        { id: "gastro",     name: "Gastro & Cafés" }
    ] },
    { id: "app",  name: "Apps",          icon: "i-app" },
    { id: "3d",   name: "3D-Druck",      icon: "i-3d" },
    { id: "exp",  name: "Experimente",   icon: "i-exp" }
];

const MONTHS = ["Jänner", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
const fmtDate = d => { const [y, m] = d.split("-"); return `${MONTHS[+m - 1]} ${y}`; };
const catOf = id => CATEGORIES.find(c => c.id === id) || CATEGORIES[0];
const subOf = (cat, id) => (catOf(cat).subs || []).find(s => s.id === id);
const tagOf = p => (subOf(p.cat, p.sub) || catOf(p.cat)).name;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const state = { projects: [], cat: "alle", sub: null, layout: "grid", query: "" };
const $ = s => document.querySelector(s);

/* Höhenlinien-Muster für die Vorschaubilder (alpines Detail) */
document.documentElement.style.setProperty("--contours", `url("data:image/svg+xml,${encodeURIComponent(
    `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300' fill='none' stroke='currentColor' stroke-width='1'>` +
    [0, 1, 2, 3, 4, 5, 6, 7].map(i => {
        const s = 1 - i * .11;
        return `<ellipse cx='${250 - i * 4}' cy='${150 + i * 3}' rx='${190 * s}' ry='${120 * s}' transform='rotate(${-12 + i * 2} 250 150)' stroke='black' stroke-opacity='.13'/>`;
    }).join("") + `</svg>`
)}")`);

/* ==========================================================
   Explorer
========================================================== */

const linkAttrs = p => p.link
    ? `href="${esc(p.link)}"${/^https?:/.test(p.link) ? ` target="_blank" rel="noopener"` : ""}`
    : `href="#" data-nolink`;

function renderFolders() {
    $("#folders").innerHTML = CATEGORIES.map(c => {
        const n = c.id === "alle" ? state.projects.length : state.projects.filter(p => p.cat === c.id).length;
        return `<li><button class="folder${state.cat === c.id ? " is-active" : ""}" data-cat="${c.id}">
            <svg class="icon folder__icon"><use href="#${c.icon}"/></svg>
            <span class="folder__name">${c.name}</span>
            <span class="folder__count">${n}</span>
        </button></li>${state.cat === c.id && c.subs ? c.subs.map(s => `<li><button class="folder folder--sub${state.sub === s.id ? " is-active" : ""}" data-cat="${c.id}" data-sub="${s.id}">
            <svg class="icon folder__icon"><use href="#i-folder"/></svg>
            <span class="folder__name">${s.name}</span>
            <span class="folder__count">${state.projects.filter(p => p.cat === c.id && p.sub === s.id).length}</span>
        </button></li>`).join("") : ""}`;
    }).join("");
}

function renderContent() {
    const cat = catOf(state.cat);
    const sub = subOf(state.cat, state.sub);
    const q = state.query.trim().toLowerCase();
    const items = state.projects
        .filter(p => state.cat === "alle" || p.cat === state.cat)
        .filter(p => !sub || p.sub === sub.id)
        .filter(p => !q || (p.title + " " + p.desc).toLowerCase().includes(q));

    $("#crumb").innerHTML = sub
        ? `<button class="crumbs__up" data-cat="${cat.id}">${esc(cat.name)}</button><svg class="icon"><use href="#i-chevron"/></svg><span class="crumbs__current">${esc(sub.name)}</span>`
        : esc(cat.name);
    $("#sumTitle").textContent = (sub || cat).name;
    $("#sumCount").textContent = `${items.length} ${items.length === 1 ? "Projekt" : "Projekte"}`;

    const el = $("#content");

    /* Kategorie mit Unterordnern: zuerst die Ordner zeigen (außer bei einer Suche) */
    if (cat.subs && !sub && !q) {
        el.innerHTML = `<div class="subfolders">${cat.subs.map((s, i) => {
            const n = items.filter(p => p.sub === s.id).length;
            return `<button class="subfolder c-${esc(cat.id)}${n ? "" : " is-empty"}" data-cat="${cat.id}" data-sub="${s.id}" style="animation-delay:${i * 50}ms">
                <span class="subfolder__icon"><svg class="icon"><use href="#i-folder"/></svg></span>
                <span><span class="subfolder__name">${esc(s.name)}</span><span class="subfolder__count">${n ? `${n} ${n === 1 ? "Eintrag" : "Einträge"}` : "Noch leer"}</span></span>
            </button>`;
        }).join("")}</div>`;
        return;
    }

    if (!state.projects.length) {
        el.innerHTML = `
        <div class="empty">
            <svg class="empty__art" viewBox="0 0 220 150" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M24 40a8 8 0 0 1 8-8h40l12 13h104a8 8 0 0 1 8 8v77a8 8 0 0 1-8 8H32a8 8 0 0 1-8-8z" fill="#F5F1EA"/>
                <path d="M24 60h172" opacity=".35"/>
                <path d="M48 128l34-42 18 20 24-34 44 56" stroke="#5C7257"/>
                <path d="M114 86l10-14 9 12" stroke="#5C7257" opacity=".5"/>
                <circle cx="160" cy="80" r="7" stroke="#C39232"/>
                <path d="M40 18v-6M34 15h12" opacity=".4"/><path d="M196 24v-6M190 21h12" opacity=".4"/>
            </svg>
            <p class="label empty__label">Noch leer</p>
            <h3 class="empty__title">Hier entsteht bald etwas.</h3>
            <p class="empty__text">Jedes abgeschlossene Projekt bekommt in diesem Explorer seinen eigenen Platz. Mit der Zeit wächst hier dein ganz persönliches Archiv.</p>
            <div class="empty__next"><span class="pulse"></span><span>Gerade in Arbeit: <strong>Projekte-Explorer</strong></span></div>
        </div>`;
        return;
    }

    if (!items.length) {
        el.innerHTML = `<p class="no-results">Keine Projekte gefunden.</p>`;
        return;
    }

    if (state.layout === "grid") {
        el.innerHTML = `<div class="grid">${items.map((p, i) => {
            const c = catOf(p.cat);
            return `<a ${linkAttrs(p)} class="card c-${esc(p.cat)}" style="animation-delay:${i * 50}ms">
                <div class="card__thumb">
                    <span class="card__tag">${esc(tagOf(p))}</span>
                    ${p.status ? `<span class="card__status">${esc(p.status)}</span>` : ""}
                    <span class="card__glyph"><svg class="icon"><use href="#${c.icon}"/></svg></span>
                </div>
                <div class="card__body">
                    <h3 class="card__title">${esc(p.title)}</h3>
                    <p class="card__desc">${esc(p.desc)}</p>
                    <div class="card__meta"><span>${fmtDate(p.date)}</span><span class="card__open">Öffnen <svg class="icon"><use href="#i-arrow"/></svg></span></div>
                </div>
            </a>`;
        }).join("")}</div>`;
    } else {
        el.innerHTML = `<div class="list">
            <div class="list__head label"><span>Name</span><span>Kategorie</span><span>Datum</span><span></span></div>
            ${items.map((p, i) => {
                const c = catOf(p.cat);
                return `<a ${linkAttrs(p)} class="row c-${esc(p.cat)}" style="animation-delay:${i * 35}ms">
                    <span class="row__name">
                        <span class="row__icon"><svg class="icon"><use href="#${c.icon}"/></svg></span>
                        <span style="min-width:0"><span class="row__title">${esc(p.title)}</span><span class="row__desc" style="display:block">${esc(p.desc)}</span></span>
                    </span>
                    <span class="row__cell">${esc(tagOf(p))}</span>
                    <span class="row__cell">${fmtDate(p.date)}</span>
                    <svg class="icon row__arrow"><use href="#i-arrow"/></svg>
                </a>`;
            }).join("")}
        </div>`;
    }
}

function renderStats() {
    $("#statProjects").textContent = state.projects.length;
    $("#statCats").textContent = new Set(state.projects.map(p => p.cat)).size;
    const latest = state.projects.map(p => p.date).sort().pop();
    $("#lastUpdate").textContent = latest ? fmtDate(latest) : "Noch keine Projekte";
}

function render() { renderFolders(); renderContent(); renderStats(); }

function startExplorer({ html, projects }) {
    $("#app").innerHTML = html;
    state.projects = [...projects].sort((a, b) => b.date.localeCompare(a.date));
    render();

    /* Ordner öffnen: Seitenleiste, Unterordner-Kacheln und Pfad */
    const openFolder = e => {
        const b = e.target.closest("[data-cat]"); if (!b) return;
        state.cat = b.dataset.cat; state.sub = b.dataset.sub || null; render();
    };
    $("#folders").addEventListener("click", openFolder);
    $("#crumb").addEventListener("click", openFolder);
    $("#content").addEventListener("click", openFolder);
    document.querySelectorAll("[data-layout]").forEach(b => b.addEventListener("click", () => {
        state.layout = b.dataset.layout;
        document.querySelectorAll("[data-layout]").forEach(x => x.classList.toggle("is-active", x === b));
        renderContent();
    }));
    $("#search").addEventListener("input", e => { state.query = e.target.value; renderContent(); });
    $("#searchJump").addEventListener("click", () => { $(".explorer").scrollIntoView({ behavior: "smooth" }); setTimeout(() => $("#search").focus(), 400); });
    $("#content").addEventListener("click", e => { if (e.target.closest("[data-nolink]")) e.preventDefault(); });
    $("#logout").addEventListener("click", () => { forgetKey(); location.reload(); });

    $("#lock").classList.add("is-leaving");
}

/* ==========================================================
   Entschlüsselung: PBKDF2-SHA256 -> AES-256-CBC + HMAC-SHA256
   (Gegenstück zu werkzeuge/veroeffentlichen.ps1)
========================================================== */

const KEY_STORE = "bergliacht-projekte-schluessel";
const payload = JSON.parse($("#payload").textContent);
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = a => btoa(String.fromCharCode(...a));

async function deriveKey(password) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: fromB64(payload.salt), iterations: payload.iter }, base, 512);
    return new Uint8Array(bits);
}

async function decrypt(keyBytes) {
    const encKey = await crypto.subtle.importKey("raw", keyBytes.slice(0, 32), "AES-CBC", false, ["decrypt"]);
    const macKey = await crypto.subtle.importKey("raw", keyBytes.slice(32), { name: "HMAC", hash: "SHA-256" }, false, ["verify"]);
    const iv = fromB64(payload.iv), data = fromB64(payload.data);
    const signed = new Uint8Array(iv.length + data.length);
    signed.set(iv); signed.set(data, iv.length);
    if (!await crypto.subtle.verify("HMAC", macKey, fromB64(payload.mac), signed)) throw new Error("Falsches Passwort");
    const plain = await crypto.subtle.decrypt({ name: "AES-CBC", iv }, encKey, data);
    return JSON.parse(new TextDecoder().decode(plain));
}

function rememberKey(keyBytes) {
    try { localStorage.setItem(KEY_STORE, JSON.stringify({ salt: payload.salt, key: toB64(keyBytes) })); } catch (e) {}
}
function forgetKey() {
    try { localStorage.removeItem(KEY_STORE); } catch (e) {}
}
function storedKey() {
    try {
        const s = JSON.parse(localStorage.getItem(KEY_STORE));
        return s && s.salt === payload.salt ? fromB64(s.key) : null;
    } catch (e) { return null; }
}

/* Lokale Vorschau ohne Verschlüsselung: Inhalt direkt aus den Quelldateien laden */
async function loadPlain() {
    const [html, projects] = await Promise.all([
        fetch("inhalt.html").then(r => r.text()),
        fetch("projekte.json").then(r => r.json())
    ]);
    return { html, projects };
}

/* ==========================================================
   Passwortseite
========================================================== */

const lockForm = $("#lockForm"), lockInput = $("#lockInput"), lockButton = $("#lockButton"), lockError = $("#lockError");

function fail(message) {
    lockError.textContent = message;
    lockForm.classList.remove("is-error"); void lockForm.offsetWidth; lockForm.classList.add("is-error");
    lockInput.select();
}

lockForm.addEventListener("submit", async e => {
    e.preventDefault();
    if (!lockInput.value) return fail("");
    lockButton.disabled = true;
    lockButton.textContent = "Wird entsperrt …";
    lockError.textContent = "";
    try {
        if (!payload) {
            startExplorer(await loadPlain());
        } else {
            const key = await deriveKey(lockInput.value);
            const content = await decrypt(key);
            if ($("#lockRemember").checked) rememberKey(key); else forgetKey();
            startExplorer(content);
        }
        lockInput.value = "";
    } catch (err) {
        fail(payload ? "Das Passwort stimmt nicht." : "Vorschau konnte nicht geladen werden.");
    } finally {
        lockButton.disabled = false;
        lockButton.textContent = "Entsperren";
    }
});

/* Beim Laden: gemerkten Schlüssel ausprobieren, sonst Passwort abfragen */
(async () => {
    $("#lockHint").hidden = !!payload;
    const key = payload && storedKey();
    if (key) {
        try { startExplorer(await decrypt(key)); return; } catch (e) { forgetKey(); }
    }
    lockInput.focus();
})();
</script>
